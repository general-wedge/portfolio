<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home"><span class="site-title-prompt">~/</span>austin</a>
  <nav class="site-nav">
    {% assign p = page.url | remove: 'index.html' %}
    <a href="{{ '/about/' | relative_url }}"{% if p == '/about/' %} class="active"{% endif %}>about</a>
    <a href="{{ '/tags/' | relative_url }}"{% if p == '/tags/' %} class="active"{% endif %}>tags</a>
    <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    <button type="button" class="theme-toggle" data-theme-toggle hidden>theme</button>
  </nav>
</header>
