# --- Site settings ---
title: Austin Howlett
tagline: Notes, writing, and the occasional experiment.
description: >-
  The personal blog of Austin Howlett — writing on software,
  engineering, and whatever else is worth a post.
author: Austin Howlett
email: austinhowletttech@gmail.com

# Where the site is served (no trailing slash). The deploy workflow replaces
# url and baseurl with the address GitHub Pages reports, so a custom domain set
# in the repo's Pages settings is picked up without editing this file. baseurl
# stays empty here so local previews are served from the root.
url: "https://general-wedge.github.io"
baseurl: ""

# --- Build settings ---
permalink: /blog/:year/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default front matter so individual files stay clean.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

# jekyll-feed: serve the blog feed at /feed.xml
feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - bin
  - lib
  - test
  - Rakefile
  - package.json
